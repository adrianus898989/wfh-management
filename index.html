<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>居家员工管理系统</title><script>
(function(){
  var appBase='%BASE_URL%';
  var redirect=sessionStorage.getItem('spa_redirect');
  if(redirect){sessionStorage.removeItem('spa_redirect');history.replaceState(null,'',redirect)}
  var recoveryKey='wfh_asset_recovery_at';
  function showFailure(message){
    var root=document.getElementById('root');
    if(!root)return;
    root.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:system-ui,sans-serif;color:#18304f"><section style="width:min(560px,100%);box-sizing:border-box;padding:30px;border:1px solid #d9e3ef;border-radius:18px;background:#fff"><h1 style="font-size:22px;margin:0 0 10px">页面资源加载失败</h1><p style="line-height:1.7;color:#62758d">系统没有让页面继续空白。请按下面按钮重新读取最新版本。</p><button id="wfh-reload" style="border:0;border-radius:10px;padding:11px 18px;background:#2f6fe4;color:#fff;font-weight:700">重新加载页面</button><p style="font-size:12px;color:#8897aa;word-break:break-word">'+String(message||'asset-load-error').replace(/[<>&]/g,'')+'</p></section></main>';
    document.getElementById('wfh-reload').onclick=function(){sessionStorage.removeItem(recoveryKey);location.reload()};
  }
  function recover(message){
    var now=Date.now();var last=Number(sessionStorage.getItem(recoveryKey)||0);
    if(now-last<60000){showFailure(message);return}
    sessionStorage.setItem(recoveryKey,String(now));
    sessionStorage.setItem('spa_redirect',location.pathname+location.search+location.hash);
    location.replace(appBase+'?__asset_reload='+now)
  }
  window.__wfhRecoverAsset=recover;
  addEventListener('error',function(event){var target=event.target;if(target&&(target.tagName==='SCRIPT'||target.tagName==='LINK'))recover('asset-load-error')},true);
  addEventListener('unhandledrejection',function(event){var message=String(event.reason&&event.reason.message||event.reason||'');if(/failed to fetch dynamically imported module|loading chunk|chunkloaderror|preload/i.test(message))recover(message)});
})()
</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>

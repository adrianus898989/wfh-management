name: Report Error Table Cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/report-error-table-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch error statistics UI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/AdminReportsPage.jsx')
          s = p.read_text(encoding='utf-8')

          new_errors = r'''function Errors({invoke,roster,onError}){
  const [range,setRange]=useState({from:'',to:''}),[data,setData]=useState(null),[loading,setLoading]=useState(true),[q,setQ]=useState(''),[type,setType]=useState(''),[qc,setQc]=useState(''),[sort,setSort]=useState({key:'qc_date',asc:false}),[page,setPage]=useState(1),[size,setSize]=useState(30),[detail,setDetail]=useState(null)
  const load=async(next=range)=>{setLoading(true);try{const d=await invoke({action:'errors',date_from:next.from,date_to:next.to});setData(d);onError('')}catch(e){onError(e.message||'错误统计读取失败')}finally{setLoading(false)}}
  useEffect(()=>{load()},[])
  useEffect(()=>{const t=setInterval(()=>load(range),60000);return()=>clearInterval(t)},[range.from,range.to])
  const allowed=useMemo(()=>new Set(roster.map(r=>r.employee_id).filter(Boolean)),[roster])
  const setSortKey=key=>setSort(prev=>({key,asc:prev.key===key?!prev.asc:true}))
  const sortMark=key=>sort.key===key?(sort.asc?' ↑':' ↓'):' ↕'
  const rows=useMemo(()=>{
    let x=(data?.rows||[]).filter(r=>allowed.has(r.employee_id))
    const qq=q.trim().toLowerCase()
    if(qq)x=x.filter(r=>[r.employee_id,r.name].map(text).join(' ').toLowerCase().includes(qq))
    if(type)x=x.filter(r=>r.error_type===type)
    if(qc)x=x.filter(r=>r.qc_person===qc)
    x=[...x].sort((a,b)=>{
      if(sort.key==='score'){
        const av=Number(a.score||0),bv=Number(b.score||0)
        return sort.asc?av-bv:bv-av
      }
      const av=text(a?.[sort.key]),bv=text(b?.[sort.key])
      return sort.asc?av.localeCompare(bv,'zh-CN',{numeric:true}):bv.localeCompare(av,'zh-CN',{numeric:true})
    })
    return x
  },[data,allowed,q,type,qc,sort])
  useEffect(()=>setPage(1),[q,type,qc,sort,size,roster])
  const pages=Math.max(1,Math.ceil(rows.length/size)),slice=rows.slice((page-1)*size,page*size)
  const quick=kind=>{const end=data?.available_to||isoToday();let next={from:'',to:''};if(kind==='7d')next={from:isoAdd(end,-6),to:end};if(kind==='month')next={from:`${end.slice(0,7)}-01`,to:end};setRange(next);load(next)}
  const SortTh=({field,children})=><th><button className="rp-sort-head" onClick={()=>setSortKey(field)}>{children}{sortMark(field)}</button></th>
  return <section className="rp-card">
    <div className="rp-card-title"><div><h2>员工错误统计</h2><p>主表只保留管理重点；会员/订单号、金额、错误备注、正确操作方式统一放进「查看」详情。</p></div><span>{rows.length} 条</span></div>
    <div className="rp-order-toolbar"><label>质检时间起<input type="date" value={range.from} onChange={e=>setRange({...range,from:e.target.value})}/></label><label>质检时间止<input type="date" value={range.to} onChange={e=>setRange({...range,to:e.target.value})}/></label><button className="primary" onClick={()=>load()}>查询</button><button onClick={()=>quick('7d')}>最近7天</button><button onClick={()=>quick('month')}>本月</button><button onClick={()=>quick('all')}>全部</button></div>
    <div className="rp-error-filters rp-error-filters-clean"><label><span>员工搜索</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="输入员工ID / 姓名"/></label><label><span>错误类型</span><Select value={type} onChange={setType} options={data?.options?.error_types||[]} all="全部错误类型"/></label><label><span>质检人</span><Select value={qc} onChange={setQc} options={data?.options?.qc_people||[]} all="全部质检人"/></label><button onClick={()=>{setQ('');setType('');setQc('')}}>重置</button></div>
    {loading&&!data?<div className="rp-loading-inline">读取员工错误…</div>:<><div className="rp-table-scroll rp-errors-scroll"><table className="rp-table rp-errors-table rp-errors-compact"><thead><tr><SortTh field="employee_id">员工ID</SortTh><SortTh field="name">姓名</SortTh><SortTh field="team">团队</SortTh><SortTh field="position">岗位</SortTh><SortTh field="platform">盘口</SortTh><SortTh field="error_type">错误类型</SortTh><SortTh field="score">扣分</SortTh><SortTh field="qc_person">质检人</SortTh><SortTh field="qc_date">质检时间</SortTh><SortTh field="leader_review">小组长复审</SortTh><SortTh field="qc_result">质检人对/错</SortTh><SortTh field="review_date">复检时间</SortTh><th>操作</th></tr></thead><tbody>{slice.map(r=><tr key={r.key}><td><button className="rp-link" onClick={()=>setDetail(r)}>{r.employee_id}</button></td><td>{r.name||'—'}</td><td>{r.team||'—'}</td><td>{r.position||'—'}</td><td><div className="rp-cell-clamp" title={r.platform}>{r.platform||'—'}</div></td><td><div className="rp-cell-clamp" title={r.error_type}>{r.error_type||'—'}</div></td><td>{text(r.score)===''?'—':r.score}</td><td>{r.qc_person||'—'}</td><td>{r.qc_date||'—'}</td><td><div className="rp-cell-clamp">{r.leader_review||'—'}</div></td><td><div className="rp-cell-clamp">{r.qc_result||'—'}</div></td><td>{r.review_date||'—'}</td><td><button className="rp-view-error" onClick={()=>setDetail(r)}>查看</button></td></tr>)}</tbody></table></div><Pagination page={page} pages={pages} total={rows.length} pageSize={size} loading={loading} onPage={setPage} onPageSize={n=>{setSize(n);setPage(1)}}/></>}
    {detail&&<ErrorDetailModal row={detail} onClose={()=>setDetail(null)}/>} 
  </section>
}

function RosterTable'''

          s,n = re.subn(r'function Errors\(\{invoke,roster,onError\}\)\{.*?\n\nfunction RosterTable',new_errors,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Errors replacement failed: {n}')
          p.write_text(s,encoding='utf-8')

          css=Path('src/styles-reports.css')
          c=css.read_text(encoding='utf-8')
          marker='/* error table compact v29.7 */'
          if marker not in c:
              c += r'''

/* error table compact v29.7 */
.rp-error-filters-clean{grid-template-columns:minmax(260px,1.6fr) minmax(180px,1fr) minmax(180px,1fr) 70px;align-items:end}
.rp-error-filters-clean label{display:block;min-width:0}
.rp-error-filters-clean label>span{display:block;margin:0 0 5px 2px;color:#7589a4;font-size:9px;font-weight:800}
.rp-error-filters-clean label select{width:100%}
.rp-errors-table.rp-errors-compact{width:1180px!important;min-width:1180px!important;table-layout:fixed}
.rp-errors-table.rp-errors-compact th:nth-child(1){width:92px}
.rp-errors-table.rp-errors-compact th:nth-child(2){width:145px}
.rp-errors-table.rp-errors-compact th:nth-child(3){width:88px}
.rp-errors-table.rp-errors-compact th:nth-child(4){width:78px}
.rp-errors-table.rp-errors-compact th:nth-child(5){width:150px}
.rp-errors-table.rp-errors-compact th:nth-child(6){width:135px}
.rp-errors-table.rp-errors-compact th:nth-child(7){width:64px}
.rp-errors-table.rp-errors-compact th:nth-child(8){width:120px}
.rp-errors-table.rp-errors-compact th:nth-child(9){width:92px}
.rp-errors-table.rp-errors-compact th:nth-child(10){width:100px}
.rp-errors-table.rp-errors-compact th:nth-child(11){width:100px}
.rp-errors-table.rp-errors-compact th:nth-child(12){width:92px}
.rp-errors-table.rp-errors-compact th:nth-child(13){width:70px}
.rp-sort-head{display:inline-flex!important;align-items:center;gap:2px;border:0!important;background:transparent!important;color:inherit!important;font:inherit!important;font-weight:800!important;padding:0!important;cursor:pointer!important;white-space:nowrap}
.rp-sort-head:hover{color:#155bd7!important}
.rp-view-error{height:28px;padding:0 10px;border:1px solid #a9c3ef;border-radius:7px;background:#fff;color:#155bd7;font-size:10px;font-weight:800;cursor:pointer}
.rp-view-error:hover{background:#eff6ff;border-color:#7da7ed}
@media(max-width:1100px){.rp-error-filters-clean{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.rp-error-filters-clean{grid-template-columns:1fr}}
'''
          css.write_text(c,encoding='utf-8')
          PY

      - name: Build check
        run: |
          npm install
          npm run build

      - name: Commit UI change and remove temporary workflow
        run: |
          git config user.name "WFH Reports Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/report-error-table-cleanup.yml
          git add src/pages/AdminReportsPage.jsx src/styles-reports.css
          git diff --cached --check
          git commit -m "fix: simplify error statistics table"
          git push origin HEAD:main

name: WFH Employee UI Hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wfh-employee-ui-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply narrow employee-module hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminEmployeesPage.jsx')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const text = v => String(v ?? '').trim()\nconst isTestEmployeeNo = v => text(v).toUpperCase().startsWith('TEST')",
                  "const text = v => String(v ?? '').trim()\nconst localDateIso = () => {\n  const d=new Date()\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`\n}\nconst blankAuditFilters = () => {\n  const today=localDateIso()\n  return {employee_no:'',full_name:'',action:'',actor:'',date_from:today,date_to:today}\n}\nconst isTestEmployeeNo = v => text(v).toUpperCase().startsWith('TEST')"
              ),
              (
                  "const [auditFilters,setAuditFilters]=useState({employee_no:'',full_name:'',action:'',actor:'',date_from:'',date_to:''})",
                  "const [auditFilters,setAuditFilters]=useState(blankAuditFilters)"
              ),
              (
                  "<div className=\"resignation-filter-panel v25-resignation-filter-panel\" style={{gridTemplateColumns:'repeat(4,minmax(0,1fr))'}}>",
                  "<div className=\"resignation-filter-panel v25-resignation-filter-panel\" style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'14px 16px',alignItems:'end'}}>",
              ),
              (
                  "<label className=\"resign-filter-field v25-resign-date\" style={{gridColumn:'1 / span 3',minWidth:0}}><span>操作日期区间</span><div className=\"pro-date-range\" style={{width:'100%'}}>",
                  "<label className=\"resign-filter-field v25-resign-date\" style={{gridColumn:'1 / span 2',minWidth:0}}><span>操作日期区间</span><div className=\"pro-date-range\" style={{width:'100%'}}>",
              ),
              (
                  "<div className=\"resign-filter-actions v25-resign-actions\" style={{gridColumn:'4',alignSelf:'end',justifyContent:'flex-end'}}>",
                  "<div className=\"resign-filter-actions v25-resign-actions\" style={{gridColumn:'3 / span 2',display:'flex',alignSelf:'end',justifyContent:'flex-end',alignItems:'end',gap:8,minHeight:42}}>",
              ),
              (
                  "onClick={()=>{const next={employee_no:'',full_name:'',action:'',actor:'',date_from:'',date_to:''};setAuditFilters(next);setAuditPage(1);loadAudit(1,auditPageSize,next)}}",
                  "onClick={()=>{const next=blankAuditFilters();setAuditFilters(next);setAuditPage(1);loadAudit(1,auditPageSize,next)}}",
              ),
              (
                  "{(detail.actions?.can_cancel_hire||isPendingHireForCancel(e.hire_date,e.status))&&<button className=\"cancel-hire-outline\" onClick={onCancelHire}>撤销入职</button>}",
                  "{(detail.actions?.can_cancel_hire||isPendingHireForCancel(e.hire_date,e.status)||(detail.actions?.can_edit&&detail.actions?.can_resign&&detail.actions?.can_reactivate))&&<button className=\"cancel-hire-outline\" title=\"不符合撤销条件时系统会安全拒绝，不会删除员工资料\" onClick={onCancelHire}>撤销入职</button>}"
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Sanity check
        run: |
          npm install
          npm run build

      - name: Commit only the employee-module changes
        run: |
          git config user.name "WFH Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wfh-employee-ui-hotfix.yml
          git add src/pages/AdminEmployeesPage.jsx
          git diff --cached --check
          git commit -m "fix: finish employee audit UI"
          git push origin HEAD:main

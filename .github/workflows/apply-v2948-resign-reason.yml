name: Apply WFH V29.4.8 resignation reason UX

on:
  push:
    paths:
      - '.github/workflows/apply-v2948-resign-reason.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch resignation reason UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminEmployeesPage.jsx')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              s=s.replace(old,new,1)

          rep(
          "  const [historyDraftFilters,setHistoryDraftFilters]=useState(blankHistoryFilters)\n\n  const [auditRows,setAuditRows]=useState([])",
          "  const [historyDraftFilters,setHistoryDraftFilters]=useState(blankHistoryFilters)\n  const [reasonPreview,setReasonPreview]=useState(null)\n\n  const [auditRows,setAuditRows]=useState([])",
          'reason preview state')

          rep(
          "        jobs.push(invoke({action:'detail',employee_id:selected.employee.id}).then(setSelected).catch(()=>{}))",
          "        jobs.push(invoke({action:'detail',employee_id:selected.employee.id}).then(d=>setSelected(prev=>({...d,resignation_reason:text(prev?.resignation_reason||d?.resignation_reason)}))).catch(()=>{}))",
          'preserve resignation reason on live refresh')

          rep(
          "        setSelected(await invoke({action:'detail',employee_id:employeeId}))",
          "        const detail=await invoke({action:'detail',employee_id:employeeId})\n        setSelected({...detail,resignation_reason:text(row?.reason)})",
          'history detail first load')

          rep(
          "        setSelected(await invoke({action:'detail',employee_id:fallbackId}))",
          "        const detail=await invoke({action:'detail',employee_id:fallbackId})\n        setSelected({...detail,resignation_reason:text(row?.reason)})",
          'history detail fallback load')

          rep(
          "['录入时间',formatDateTime(e.created_at)],['离职日期',text(e.resign_date).slice(0,10)]]}/>",
          "['录入时间',formatDateTime(e.created_at)],['离职日期',text(e.resign_date).slice(0,10)],...(e.status==='resigned'?[['离职原因',text(detail.resignation_reason)||'—']]:[])]}/>",
          'drawer resignation reason row')

          rep(
          "            <td className=\"reason-cell\">{r.reason||'-'}</td>",
          "            <td className=\"reason-cell\">{text(r.reason)?<button type=\"button\" title=\"点击查看完整离职原因\" onClick={()=>setReasonPreview({reason:text(r.reason),employee_no:r.employee_no,full_name:r.full_name,resign_date:r.effective_date})} style={{display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',maxWidth:230,padding:0,border:0,background:'transparent',color:'inherit',font:'inherit',lineHeight:1.45,textAlign:'left',cursor:'pointer',wordBreak:'break-word'}}>{text(r.reason).length>90?`${text(r.reason).slice(0,90)}…`:text(r.reason)}</button>:'—'}</td>",
          'history reason preview')

          rep(
          "    {analysisDetail&&<AnalysisDetailModal state={analysisDetail} loading={analysisDetailLoading} onClose={()=>setAnalysisDetail(null)} onOpenEmployee={row=>openHistoryDetail(row)}/>}",
          "    {reasonPreview&&<div className=\"modal-mask employee-action-modal-mask\" onMouseDown={()=>setReasonPreview(null)}><div className=\"modal-card\" style={{width:'min(720px,calc(100vw - 40px))',maxWidth:720}} onMouseDown={e=>e.stopPropagation()}>\n      <div className=\"modal-head\"><div><span className=\"modal-kicker\">RESIGNATION REASON</span><h2>完整离职原因</h2><p>{reasonPreview.employee_no||'—'} · {reasonPreview.full_name||'—'} · {reasonPreview.resign_date||'—'}</p></div><button onClick={()=>setReasonPreview(null)}>×</button></div>\n      <div style={{padding:'0 24px 24px'}}><div style={{whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:1.8,fontSize:14,color:'#243b5a',padding:'16px 18px',border:'1px solid #dbe5f1',borderRadius:12,background:'#f8fbff',maxHeight:'55vh',overflow:'auto'}}>{reasonPreview.reason}</div></div>\n    </div></div>}\n\n    {analysisDetail&&<AnalysisDetailModal state={analysisDetail} loading={analysisDetailLoading} onClose={()=>setAnalysisDetail(null)} onOpenEmployee={row=>openHistoryDetail(row)}/>}",
          'reason full modal')

          p.write_text(s)
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "WFH Patch Bot"
          git config user.email "wfh-patch-bot@users.noreply.github.com"
          git add src/pages/AdminEmployeesPage.jsx
          git rm .github/workflows/apply-v2948-resign-reason.yml
          git commit -m "Improve resignation reason display"
          git push

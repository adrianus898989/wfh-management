name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_RELEASE_ID: ${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run test:employee-master-sync
      - run: npm run test:frontend-regressions
      - run: npm run build

      - name: Copy GitHub Pages SPA fallback
        run: cp 404.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Optionally invalidate sessions in the database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_RELEASE_ID: ${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not configured; browser release.json enforcement remains active."
            exit 0
          fi
          test -n "$SUPABASE_URL"
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"p_release_id\":\"$APP_RELEASE_ID\"}" \
            "$SUPABASE_URL/rest/v1/rpc/app_release_advance"

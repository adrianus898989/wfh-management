name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEGACY_REDIRECT_RELEASE_ID: ${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}:redirect-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run test:employee-master-sync
      - run: npm run test:dual-host
      - run: npm run test:edge-cors
      - run: npm run test:cloudflare-gate
      - run: npm run test:portal-ip-edge-gate
      - run: npm run test:frontend-regressions
      - run: npm run build:github-redirect

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

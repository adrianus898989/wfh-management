name: Apply targeted history hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-v2948-history-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal employee-history fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminEmployeesPage.jsx')
          s=p.read_text()

          old='''            <td><div className="operation-record"><span className="operator-chip">{operatorDisplay(r.operator_account)}</span><small>{formatDateTime(r.operation_time||r.created_at)}</small></div></td>'''
          new='''            <td><div className="operation-record"><span className="operator-chip">{operatorDisplay(r.snapshot?.operator_account||r.snapshot?.operator_email||r.snapshot?.last_edited_username||r.operator_account)}</span><small>{formatDateTime(r.snapshot?.operation_time||r.snapshot?.last_edited_at||r.operation_time||r.created_at)}</small></div></td>'''
          if old not in s:
              raise SystemExit('operator target not found')
          s=s.replace(old,new,1)

          old2='''  const openDetail=async row=>{\n    setSelected({employee:row,missing_fields:row.missing_fields||[]})\n    setDetailLoading(true)\n    try{ setSelected(await invoke({action:'detail',employee_id:row.id})) }\n    catch(e){ setError(e.message); setSelected(null) }\n    finally{ setDetailLoading(false) }\n  }'''
          new2='''  const openDetail=async row=>{\n    setSelected({employee:row,missing_fields:row.missing_fields||[]})\n    setDetailLoading(true)\n    try{\n      const detail=await invoke({action:'detail',employee_id:row.id})\n      if(detail?.employee?.status==='resigned'&&!text(detail.resignation_reason)&&text(detail.employee.employee_no)){\n        try{\n          const h=await invoke({action:'history_list',page:1,page_size:20,filters:{employee_no:text(detail.employee.employee_no)}})\n          const match=(h.rows||[]).find(x=>text(x.employee_no).toUpperCase()===text(detail.employee.employee_no).toUpperCase()&&text(x.reason))\n          if(match) detail.resignation_reason=text(match.reason)\n        }catch(_){}\n      }\n      setSelected(detail)\n    }\n    catch(e){ setError(e.message); setSelected(null) }\n    finally{ setDetailLoading(false) }\n  }'''
          if old2 not in s:
              raise SystemExit('openDetail target not found')
          s=s.replace(old2,new2,1)

          p.write_text(s)
          PY
          git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "WFH Patch Bot"
          git config user.email "wfh-patch-bot@users.noreply.github.com"
          git add src/pages/AdminEmployeesPage.jsx
          git rm .github/workflows/apply-v2948-history-hotfix.yml
          git commit -m "Fix resignation detail and Google editor display"
          git push

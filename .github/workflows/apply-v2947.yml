name: Apply WFH V29.4.7 frontend patch

on:
  push:
    paths:
      - '.github/workflows/apply-v2947.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply frontend patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/v2947.patch').write_bytes(base64.b64decode(''''''))
          PY
          git apply --check /tmp/v2947.patch
          git apply /tmp/v2947.patch
          git diff --check
      - name: Commit frontend patch
        shell: bash
        run: |
          git config user.name "WFH Patch Bot"
          git config user.email "wfh-patch-bot@users.noreply.github.com"
          git add src/pages/AdminEmployeesPage.jsx
          git rm .github/workflows/apply-v2947.yml
          git commit -m "Fix operator labels and team analytics"
          git push

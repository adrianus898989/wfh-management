name: Apply V27.12 report UI

on:
  push:
    paths:
      - '.github/workflows/apply-v2712-report-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply V27.12 patch
        shell: bash
        run: |
          python .github/apply_v2712.py
          git diff --check
          npm install
          npm run build
          git diff --stat

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "WFH Patch Bot"
          git config user.email "wfh-patch-bot@users.noreply.github.com"
          git add src/pages/AdminReportsPage.jsx src/styles-reports.css src/main.jsx
          git rm .github/apply_v2712.py .github/workflows/apply-v2712-report-ui.yml
          git commit -m "fix: restore workload stats and responsive report UI"
          git push

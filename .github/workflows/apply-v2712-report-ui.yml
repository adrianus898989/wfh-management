name: Apply V27.12 report UI

on:
  push:
    paths:
      - '.github/workflows/apply-v2712-report-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply report fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def once(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              return s.replace(old, new, 1)

          p=Path('src/pages/AdminReportsPage.jsx')
          s=p.read_text()

          s=once(s,
            "      {tab==='总汇'&&<Overview data={overview} rows={roster}/>} ",
            "      {tab==='总汇'&&<Overview data={overview} rows={roster} invoke={invoke}/>} ",
            'pass invoke to overview')

          s=once(s,
            "function Overview({data,rows}){\n  const [modal,setModal]=useState(null),[manager,setManager]=useState(null)",
            """function Overview({data,rows,invoke}){\n  const [modal,setModal]=useState(null),[manager,setManager]=useState(null)\n  const [workload,setWorkload]=useState({loading:true,error:'',rows:[],dates:[],from:'',to:''})\n  const loadWorkload=async(silent=false)=>{\n    if(!silent)setWorkload(v=>({...v,loading:true,error:''}))\n    try{\n      const end=isoToday(),start=isoAdd(end,-13)\n      const d=await invoke({action:'orders',date_from:start,date_to:end})\n      const recentDates=(d?.dates||[]).slice(-7)\n      setWorkload({...d,dates:recentDates,loading:false,error:''})\n    }catch(e){\n      setWorkload(v=>({...v,loading:false,error:e?.message||'每日工作量读取失败'}))\n    }\n  }\n  useEffect(()=>{\n    loadWorkload()\n    const t=setInterval(()=>{if(!document.hidden)loadWorkload(true)},60000)\n    return()=>clearInterval(t)\n  },[])\n  const orderById=useMemo(()=>new Map((workload.rows||[]).map(x=>[text(x.employee_id).toUpperCase(),x])),[workload.rows])""",
            'overview workload state')

          old_special="const specialStats=(list,pos)=>{const people=list.filter(r=>text(r.position)===pos),ids=uniq(people.map(r=>r.employee_id));let total=0,days=0;ids.forEach(id=>{const s=data?.order_summary?.[id];if(s){total+=Number(s.total||0);days+=Number(s.working_days||0)}});return {count:uniqueCount(people),avg:days?(total/days).toFixed(1):'0.0',people}}"
          new_special="""const specialStats=(list,pos)=>{\n    const people=list.filter(r=>text(r.position)===pos),ids=uniq(people.map(r=>r.employee_id))\n    let total=0,days=0\n    ids.forEach(id=>{\n      const order=orderById.get(text(id).toUpperCase())\n      if(!order)return\n      ;(workload.dates||[]).forEach(d=>{\n        const day=order.daily?.[d]||{}\n        const n=Number(day.success||0)+Number(day.reject||0)\n        if(n>0){total+=n;days+=1}\n      })\n    })\n    return {count:uniqueCount(people),avg:days?(total/days).toFixed(1):'0.0',people,total,days}\n  }"""
          s=once(s,old_special,new_special,'restore special workload averages')

          old_team='''    <section className="rp-card rp-team-matrix-card"><div className="rp-card-title"><div><h2>团队统计表</h2><p>普通岗位显示人数；出款 / 彩金 / 客服 / 查单显示人数 + 平均每天处理。</p></div><span>{teams.length} 个团队</span></div><div className="rp-table-scroll"><table className="rp-table rp-team-table"><thead><tr><th>团队</th><th>总人数</th>{positions.map(p=><th key={p}>{p}</th>)}{SPECIAL_POSITIONS.map(p=><th key={p}>{p}</th>)}</tr></thead><tbody>{teams.map(t=><tr key={t.team}><td><button className="rp-link" onClick={()=>openPeople(`${t.team} 员工名单`,t.list)}>{t.team}</button></td><td><button className="rp-link" onClick={()=>openPeople(`${t.team} 员工名单`,t.list)}>{t.total}</button></td>{positions.map(p=>{const list=t.list.filter(r=>text(r.position)===p);return <td key={p}><button className="rp-link" onClick={()=>openPeople(`${t.team} · ${p}`,list)}>{uniqueCount(list)}</button></td>})}{SPECIAL_POSITIONS.map(p=>{const s=specialStats(t.list,p);return <td key={p}><button className="rp-special-count" onClick={()=>openPeople(`${t.team} · ${p}`,s.people)}>{s.count}</button><button className="rp-avg" onClick={()=>setModal({average:true,title:`${t.team} · ${p}`,rows:s.people,avg:s.avg})}>📊 {s.avg}</button></td>})}</tr>)}</tbody></table></div></section>'''
          new_team='''    <section className="rp-card rp-team-matrix-card"><div className="rp-card-title"><div><h2>团队统计表</h2><p>普通岗位显示人数；出款 / 彩金 / 客服 / 查单恢复效率表最近 7 个数据日的「人数 + 日均处理笔数」。</p></div><div className="rp-team-meta"><span>{teams.length} 个团队</span><span className={`rp-workload-state ${workload.error?'error':workload.loading?'loading':'ok'}`}>{workload.loading?'效率数据读取中…':workload.error?'效率数据读取失败':workload.dates?.length?`工作量 ${workload.dates[0].slice(5)} ~ ${workload.dates[workload.dates.length-1].slice(5)}`:'暂无工作量日期'}</span></div></div><div className="rp-table-scroll"><table className="rp-table rp-team-table"><thead><tr><th>团队</th><th>总人数</th>{positions.map(p=><th key={p}>{p}</th>)}{SPECIAL_POSITIONS.map(p=><th key={p}>{p}</th>)}</tr></thead><tbody>{teams.map(t=><tr key={t.team}><td><button className="rp-link" onClick={()=>openPeople(`${t.team} 员工名单`,t.list)}>{t.team}</button></td><td><button className="rp-link" onClick={()=>openPeople(`${t.team} 员工名单`,t.list)}>{t.total}</button></td>{positions.map(p=>{const list=t.list.filter(r=>text(r.position)===p);return <td key={p}><button className="rp-link" onClick={()=>openPeople(`${t.team} · ${p}`,list)}>{uniqueCount(list)}</button></td>})}{SPECIAL_POSITIONS.map(p=>{const s=specialStats(t.list,p);return <td key={p}><button className="rp-special-count" onClick={()=>openPeople(`${t.team} · ${p}`,s.people)}>{s.count}</button><button className="rp-avg" disabled={!workload.dates?.length} onClick={()=>setModal({average:true,title:`${t.team} · ${p}`,rows:s.people,avg:s.avg})}>日均 {workload.loading?'…':workload.error?'—':s.avg}</button></td>})}</tr>)}</tbody></table></div></section>'''
          s=once(s,old_team,new_team,'team workload UI')

          old_tail='''    <div className="rp-grid2"><Ranking title="岗位分布" rows={rows} field="position" onOpen={openPeople}/><Ranking title="团队人数" rows={rows} field="team" onOpen={openPeople}/></div>{modal?.average?<AverageModal data={data} modal={modal} onClose={()=>setModal(null)} onOpenPeople={openPeople}/>:modal&&<RosterModal title={modal.title} rows={modal.rows} onClose={()=>setModal(null)}/>} {manager&&<ManagerModal cfg={manager} roster={rows} onClose={()=>setManager(null)} onOpen={openPeople}/>}</>}'''
          new_tail='''    <div className="rp-grid2 rp-insight-grid"><DistributionDonut title="岗位分布" rows={rows} field="position" onOpen={openPeople}/><TeamBarChart title="团队人数" rows={rows} field="team" onOpen={openPeople}/></div>{modal?.average?<AverageModal workload={workload} modal={modal} onClose={()=>setModal(null)} onOpenPeople={openPeople}/>:modal&&<RosterModal title={modal.title} rows={modal.rows} onClose={()=>setModal(null)}/>} {manager&&<ManagerModal cfg={manager} roster={rows} onClose={()=>setManager(null)} onOpen={(title,list)=>{setManager(null);openPeople(title,list)}}/>}</>}'''
          s=once(s,old_tail,new_tail,'overview visual panels and modal stacking')

          start=s.index('function Ranking(')
          end=s.index('\nfunction ManagerModal(',start)
          charts=r'''const REPORT_CHART_COLORS=['#2563eb','#8b5cf6','#14b8a6','#f59e0b','#ef4444','#06b6d4','#84cc16','#f97316','#ec4899','#64748b','#0ea5e9','#a855f7']
function groupedPeople(rows,field){const m=new Map();(rows||[]).forEach(r=>{const k=text(r[field])||'未填写';if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return [...m].map(([name,list])=>({name,list,count:uniqueCount(list)})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'zh-CN'))}
function DistributionDonut({title,rows,field,onOpen}){const groups=useMemo(()=>groupedPeople(rows,field),[rows,field]),total=uniqueCount(rows)||1;let cursor=0;const stops=groups.slice(0,12).map((x,i)=>{const start=cursor;cursor+=x.count/total*100;return `${REPORT_CHART_COLORS[i%REPORT_CHART_COLORS.length]} ${start}% ${cursor}%`});if(cursor<100)stops.push(`#e7edf5 ${cursor}% 100%`);return <section className="rp-card rp-chart-card"><div className="rp-card-title"><div><h3>{title}</h3><p>按人数比例展示 · 点击图例查看具体员工</p></div><span>{groups.length} 类</span></div><div className="rp-donut-layout"><div className="rp-donut" style={{background:`conic-gradient(${stops.join(',')})`}}><div><strong>{uniqueCount(rows)}</strong><span>总人数</span></div></div><div className="rp-donut-legend">{groups.slice(0,12).map((x,i)=><button key={x.name} onClick={()=>onOpen(`${x.name} · ${x.count} 人`,x.list)}><i style={{background:REPORT_CHART_COLORS[i%REPORT_CHART_COLORS.length]}}/><span>{x.name}</span><strong>{x.count}</strong><em>{fmtPct(x.count,total)}</em></button>)}</div></div></section>}
function TeamBarChart({title,rows,field,onOpen}){const groups=useMemo(()=>groupedPeople(rows,field).slice(0,12),[rows,field]),max=Math.max(1,...groups.map(x=>x.count));return <section className="rp-card rp-chart-card"><div className="rp-card-title"><div><h3>{title}</h3><p>自适应横向比例 · 点击条形查看团队人员</p></div><span>TOP {groups.length}</span></div><div className="rp-team-bars">{groups.map(x=><button key={x.name} onClick={()=>onOpen(`${x.name} · ${x.count} 人`,x.list)}><span title={x.name}>{x.name}</span><i><b style={{width:`${Math.max(2,x.count/max*100)}%`}}/></i><strong>{x.count}</strong></button>)}</div></section>}'''
          s=s[:start]+charts+s[end:]

          avg_start=s.index('function AverageModal(')
          avg_end=s.index('\n\nfunction People(',avg_start)
          avg_new=r'''function AverageModal({workload,modal,onClose,onOpenPeople}){const dates=workload?.dates||[],orderById=new Map((workload?.rows||[]).map(x=>[text(x.employee_id).toUpperCase(),x])),dayValue=(order,d)=>{const v=order?.daily?.[d]||{};return Number(v.success||0)+Number(v.reject||0)},list=modal.rows.map(r=>{const order=orderById.get(text(r.employee_id).toUpperCase());const daily=Object.fromEntries(dates.map(d=>[d,dayValue(order,d)]));return {r,daily,total:dates.reduce((s,d)=>s+(daily[d]||0),0)}}).filter(x=>x.total>0).sort((a,b)=>b.total-a.total),lows={};dates.forEach(d=>{const vals=uniq(list.map(x=>String(x.daily[d]||0))).map(Number).filter(v=>v>0).sort((a,b)=>a-b);lows[d]=vals.slice(0,3)});return <Modal title={`${modal.title}（日均 ${modal.avg} 笔）`} onClose={onClose} wide><div className="rp-average-summary">效率表最近 {dates.length||0} 个数据日 · 红 / 橙 / 黄 = 当天倒数前三个正数 · 数字为成功 + 驳回总笔数</div>{!dates.length?<div className="rp-loading-inline">暂无每日工作量日期</div>:!list.length?<div className="rp-loading-inline">该岗位最近数据日暂无有效处理笔数</div>:<div className="rp-table-scroll"><table className="rp-table rp-average-table"><thead><tr><th>#</th><th>ID</th><th>姓名</th><th>近7日总量</th>{dates.map(d=><th key={d}>{d.slice(5)}</th>)}</tr></thead><tbody>{list.map((x,i)=><tr key={`${x.r.employee_id}-${i}`}><td>{i+1}</td><td><button className="rp-link" onClick={()=>onOpenPeople('员工详情',[x.r])}>{x.r.employee_id||'—'}</button></td><td>{x.r.name}</td><td><strong>{x.total}</strong></td>{dates.map(d=>{const v=Number(x.daily[d]||0),rank=lows[d].indexOf(v);return <td key={d}><span className={v>0?rank===0?'rp-low1':rank===1?'rp-low2':rank===2?'rp-low3':'rp-positive':'rp-zero'}>{v||'—'}</span></td>})}</tr>)}</tbody></table></div>}</Modal>}'''
          s=s[:avg_start]+avg_new+s[avg_end:]

          p.write_text(s)

          p=Path('src/styles-reports.css')
          s=p.read_text()
          extra=r'''

/* V27.12 — report summary: adaptive layout + restored efficiency workload */
.rp-kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.rp-team-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;color:#6d8099;font-size:10px;font-weight:750}
.rp-workload-state{display:inline-flex;align-items:center;min-height:27px;padding:0 9px;border-radius:999px;border:1px solid #dbe5f2;background:#f8fbff;color:#5c718d}
.rp-workload-state.ok{border-color:#ccebd7;background:#f1fbf5;color:#39734a}.rp-workload-state.loading{color:#55749d}.rp-workload-state.error{border-color:#fecdd3;background:#fff1f2;color:#b42334}
.rp-team-matrix-card .rp-table-scroll{max-height:620px;overflow:auto}
.rp-team-table{width:100%!important;min-width:1320px!important;table-layout:fixed!important}
.rp-team-table th{position:sticky;top:0;z-index:5;background:#111827!important;color:#f8fafc!important;border-bottom-color:#111827!important;text-align:center!important;padding:10px 7px!important;font-size:9px!important}
.rp-team-table th:first-child{left:0;z-index:7!important;width:92px!important;text-align:left!important}
.rp-team-table th:nth-child(2){width:62px!important}
.rp-team-table td{height:52px;padding:8px 7px!important;text-align:center!important;vertical-align:middle!important;font-size:10px!important}
.rp-team-table td:first-child{position:sticky;left:0;z-index:4;background:#fff!important;text-align:left!important;box-shadow:1px 0 0 #edf1f5}
.rp-team-table tbody tr:nth-child(even) td{background:#fbfcfe}.rp-team-table tbody tr:nth-child(even) td:first-child{background:#fbfcfe!important}.rp-team-table tbody tr:hover td{background:#f5f9ff!important}.rp-team-table tbody tr:hover td:first-child{background:#f5f9ff!important}
.rp-special-count{font-size:11px;line-height:1.1}.rp-avg{display:inline-flex!important;align-items:center;justify-content:center;margin:4px auto 0!important;min-width:54px;background:#f2f6fb!important;color:#4d6d97!important;border:1px solid #e2eaf4!important;padding:3px 7px!important}.rp-avg:disabled{opacity:.6;cursor:default}.rp-avg:not(:disabled):hover{background:#e8f1ff!important;color:#155bd7!important}
.rp-insight-grid{align-items:stretch}.rp-chart-card{min-height:360px}.rp-donut-layout{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(260px,1.2fr);gap:22px;align-items:center;padding:18px 20px 22px}.rp-donut{width:min(260px,24vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:auto;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04)}.rp-donut>div{width:54%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;box-shadow:0 0 0 1px #e9eef5}.rp-donut strong{font-size:27px;color:#172b4d}.rp-donut span{margin-top:2px;font-size:9px;color:#8494aa}
.rp-donut-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.rp-donut-legend button{display:grid;grid-template-columns:9px minmax(0,1fr) auto auto;gap:7px;align-items:center;border:0;background:transparent;padding:6px 4px;color:#405974;text-align:left;cursor:pointer;border-radius:7px}.rp-donut-legend button:hover{background:#f5f9ff}.rp-donut-legend button>i{width:8px;height:8px;border-radius:3px}.rp-donut-legend button>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp-donut-legend button>strong{font-size:10px;color:#203a5b}.rp-donut-legend button>em{font-style:normal;font-size:9px;color:#90a0b4;min-width:42px;text-align:right}
.rp-team-bars{display:grid;gap:8px;padding:18px 20px 22px}.rp-team-bars button{display:grid;grid-template-columns:minmax(74px,120px) minmax(100px,1fr) 42px;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:5px 4px;color:#405974;cursor:pointer;border-radius:7px}.rp-team-bars button:hover{background:#f6f9fd}.rp-team-bars button>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:700}.rp-team-bars button>i{height:10px;border-radius:999px;background:#edf2f8;overflow:hidden}.rp-team-bars button>i>b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#93c5fd)}.rp-team-bars button>strong{text-align:right;color:#1f3b61}
.rp-manager-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.rp-manager-grid button{min-height:72px}
.rp-modal{width:min(980px,94vw)}.rp-modal.wide{width:min(1540px,calc(100vw - 54px));max-width:1540px}.rp-modal-body{width:100%}.rp-modal-body>.rp-table-scroll{width:100%;max-width:100%}.rp-roster-table{width:100%!important;min-width:1180px!important;table-layout:auto!important}.rp-average-table{min-width:980px!important;width:100%!important}
@media(max-width:1300px){.rp-team-table{min-width:1280px!important}.rp-donut-layout{grid-template-columns:1fr}.rp-donut{width:min(250px,48vw)}.rp-donut-legend{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.rp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-donut-legend{grid-template-columns:1fr}.rp-team-bars button{grid-template-columns:86px minmax(90px,1fr) 36px}.rp-modal.wide{width:calc(100vw - 16px)}.rp-modal-mask{padding:8px}}
@media(max-width:620px){.rp-kpis{grid-template-columns:1fr}.rp-donut-layout{padding:14px}.rp-donut{width:min(240px,70vw)}.rp-team-meta{justify-content:flex-start}.rp-chart-card{min-height:0}}
'''
          if 'V27.12 — report summary' not in s:
              s += extra
          p.write_text(s)

          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace("employee-v27.11-stable-data-layout","employee-v27.12-report-workload-adaptive")
          p.write_text(s)

          Path('.github/workflows/apply-v2712-report-ui.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore workload stats and responsive report UI"
          git push

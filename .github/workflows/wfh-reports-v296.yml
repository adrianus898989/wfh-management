name: WFH Reports V29.6 Alignment

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wfh-reports-v296.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply report-only alignment patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/AdminReportsPage.jsx')
          s = p.read_text(encoding='utf-8')

          old = "const fmtPct=(n,d)=>d?`${((n/d)*100).toFixed(2)}%`:'0.00%'\n"
          new = old + "const peoplePriority=r=>{const pos=text(r.position),grp=text(r.group),work=text(r.work_content);if(pos==='组长'||grp.includes('组长')||work.includes('组长'))return 0;if(pos==='培训'||grp.includes('培训'))return 1;return 2}\nconst sortPeopleRows=rows=>[...(rows||[])].sort((a,b)=>peoplePriority(a)-peoplePriority(b)||text(a.group).localeCompare(text(b.group),'zh-CN')||text(a.team).localeCompare(text(b.team),'zh-CN')||text(a.name).localeCompare(text(b.name),'zh-CN'))\n"
          if s.count(old) != 1: raise SystemExit('fmtPct insertion point mismatch')
          s = s.replace(old,new,1)

          if s.count("setInterval(()=>load(true),60000)") != 1: raise SystemExit('overview interval mismatch')
          s = s.replace("setInterval(()=>load(true),60000)","setInterval(()=>load(true),30000)",1)

          old_live = "<div className=\"rp-live\"><i/><span>{overview?.updated_at?`实时更新 ${new Date(overview.updated_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`:'读取中'}</span><button onClick={()=>load()}>刷新</button></div>"
          new_live = "<div className=\"rp-live\"><i/><span>{overview?.updated_at?`Google → Supabase → 页面 · ${new Date(overview.updated_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · 30秒自动同步`:'读取中'}</span><button onClick={()=>load()}>刷新</button></div>"
          if s.count(old_live) != 1: raise SystemExit('live label mismatch')
          s = s.replace(old_live,new_live,1)

          people_new = r'''function People({rows}){
  const [mode,setMode]=useState('cards'),[page,setPage]=useState(1),[size,setSize]=useState(24),[modal,setModal]=useState(null)
  const sorted=useMemo(()=>sortPeopleRows(rows),[rows])
  useEffect(()=>setPage(1),[rows,mode,size])
  const pages=Math.max(1,Math.ceil(sorted.length/size)),slice=sorted.slice((page-1)*size,page*size)
  return <section className="rp-card"><div className="rp-card-title"><div><h2>Employees</h2><p>字段与原版一致；组长 / 现场组长优先展示。人员只看居家排班表，不要求必须存在于居家员工名单。</p></div><div className="rp-view-buttons"><button className={mode==='cards'?'active':''} onClick={()=>setMode('cards')}>Cards view（不横滚）</button><button className={mode==='table'?'active':''} onClick={()=>setMode('table')}>Table view（完整列）</button><button onClick={()=>setModal({title:'Employees 完整表',rows:sorted})}>弹窗全屏查看</button></div></div>{mode==='cards'?<div className="rp-cards">{slice.map(r=>{const leader=peoplePriority(r)===0;return <article className={`rp-person-card ${leader?'is-leader':''}`} key={r.key}><div className="rp-person-top"><div className="rp-person-main"><strong>{r.name||'(未填写姓名)'}</strong><div className="rp-person-badges"><span>{r.position||'未填写'}</span><span>团队: {r.team||'未填写'}</span><span>组别: {r.group||'未填写'}</span>{r.shift&&<span>班次: {r.shift}</span>}</div></div><div className="rp-person-side"><em>{r.employee_id||'No ID'}</em><small>{r.country||'—'}</small></div></div><dl><div><dt>负责人</dt><dd>{r.responsible||'—'}</dd></div><div><dt>现场培训</dt><dd>{r.onsite_trainer||'—'}</dd></div><div><dt>线上组长</dt><dd>{r.online_leader||'—'}</dd></div><div><dt>线上培训</dt><dd>{r.online_trainer||'—'}</dd></div><div className="wide"><dt>盘口</dt><dd>{r.platform||'—'}</dd></div><div className="wide"><dt>工作内容</dt><dd>{r.work_content||'—'}</dd></div></dl></article>})}</div>:<RosterTable rows={slice}/>}<Pagination page={page} pages={pages} total={sorted.length} pageSize={size} onPage={setPage} onPageSize={n=>{setSize(n);setPage(1)}}/>{modal&&<RosterModal title={modal.title} rows={modal.rows} onClose={()=>setModal(null)}/>}</section>
}

function Schedule'''
          s, n = re.subn(r'function People\(\{rows\}\)\{.*?\n\}\n\nfunction Schedule', people_new, s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'People replacement count={n}')

          orders_marker = "  useEffect(()=>{load()},[])\n  const allowed=useMemo(()=>new Set(roster.map(r=>r.employee_id)),[roster])"
          orders_repl = "  useEffect(()=>{load()},[])\n  useEffect(()=>{const t=setInterval(()=>load(range),60000);return()=>clearInterval(t)},[range.from,range.to])\n  const allowed=useMemo(()=>new Set(roster.map(r=>r.employee_id).filter(Boolean)),[roster])"
          if s.count(orders_marker) != 1: raise SystemExit('orders interval insertion mismatch')
          s = s.replace(orders_marker,orders_repl,1)
          s = s.replace('按当前在职员工 ID 汇总；数据直接合并效率表「工作表4」+「填表」。','按当前排班员工 ID 汇总；效率数据读取「网站数据」（由工作表4 + 填表生成），与原版网址同源。',1)

          errors_marker = "  useEffect(()=>{load()},[])\n  const allowed=useMemo(()=>new Set(roster.map(r=>r.employee_id)),[roster])"
          errors_repl = "  useEffect(()=>{load()},[])\n  useEffect(()=>{const t=setInterval(()=>load(range),60000);return()=>clearInterval(t)},[range.from,range.to])\n  const allowed=useMemo(()=>new Set(roster.map(r=>r.employee_id).filter(Boolean)),[roster])"
          if s.count(errors_marker) != 1: raise SystemExit('errors interval insertion mismatch')
          s = s.replace(errors_marker,errors_repl,1)

          p.write_text(s,encoding='utf-8')

          css = Path('src/styles-reports.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* V29.6 — original-source alignment + contained tables */'
          if marker not in c:
            c += r'''

/* V29.6 — original-source alignment + contained tables */
.reports-page.rp-page{min-width:0;max-width:100%;overflow-x:hidden}
.rp-page .rp-card,.rp-page .rp-team-matrix-card,.rp-page .rp-grid2{min-width:0;max-width:100%}
.rp-page .rp-table-scroll{display:block;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:auto;overscroll-behavior-x:contain}
.rp-page .rp-table td,.rp-page .rp-table th{max-width:320px}
.rp-page .rp-pan-cell{max-width:190px!important;width:190px;white-space:normal!important;overflow-wrap:anywhere;word-break:break-word;line-height:1.4}
.rp-page .rp-truncate{max-width:190px!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.rp-page .rp-errors-table{width:1560px!important;min-width:1560px!important;table-layout:fixed}
.rp-page .rp-errors-table th,.rp-page .rp-errors-table td{overflow:hidden}
.rp-page .rp-errors-table th:nth-child(1){width:78px}.rp-page .rp-errors-table th:nth-child(2){width:118px}.rp-page .rp-errors-table th:nth-child(3){width:78px}.rp-page .rp-errors-table th:nth-child(4){width:76px}.rp-page .rp-errors-table th:nth-child(5){width:175px}.rp-page .rp-errors-table th:nth-child(6){width:145px}.rp-page .rp-errors-table th:nth-child(7){width:86px}.rp-page .rp-errors-table th:nth-child(8){width:180px}.rp-page .rp-errors-table th:nth-child(9){width:180px}.rp-page .rp-errors-table th:nth-child(10){width:112px}.rp-page .rp-errors-table th:nth-child(11){width:64px}.rp-page .rp-errors-table th:nth-child(12){width:92px}.rp-page .rp-errors-table th:nth-child(13){width:92px}.rp-page .rp-errors-table th:nth-child(14){width:96px}.rp-page .rp-errors-table th:nth-child(15){width:115px}.rp-page .rp-errors-table th:nth-child(16){width:96px}
.rp-person-main{min-width:0;flex:1}.rp-person-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.rp-person-badges span{display:inline-flex!important;margin:0!important;background:#f5f8fc;border:1px solid #e0e7f1;border-radius:999px;padding:4px 7px;color:#445b78!important;font-size:9px!important;white-space:nowrap}.rp-person-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px}.rp-person-side small{font-size:9px;color:#71849f;font-weight:700}.rp-person-card.is-leader{border-color:#aac4f4;background:linear-gradient(180deg,#fff,#f8fbff);box-shadow:0 6px 18px rgba(37,99,235,.07)}
.rp-person-card dl>div.wide dd{overflow-wrap:anywhere;word-break:break-word}
@media(max-width:1500px){.rp-page .rp-errors-table{width:1480px!important;min-width:1480px!important}}
'''
          css.write_text(c,encoding='utf-8')
          PY

      - name: Build check
        run: |
          npm install
          npm run build

      - name: Commit report-only changes and remove workflow
        run: |
          git config user.name "WFH Reports Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wfh-reports-v296.yml
          git add src/pages/AdminReportsPage.jsx src/styles-reports.css
          git diff --cached --check
          git commit -m "fix: align reports with original sheet logic"
          git push origin HEAD:main

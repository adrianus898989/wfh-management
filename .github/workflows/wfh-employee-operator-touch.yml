name: WFH Employee Operator Touch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wfh-employee-operator-touch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply narrow employee-module changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminEmployeesPage.jsx')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const [archiveStats,setArchiveStats]=useState({loading:true,error:'',as_of:'',active:0,total:0,latest_updated_at:'',tenure:[],positions:[],platforms:[],countries:[]})",
                  "const [archiveStats,setArchiveStats]=useState({loading:true,error:'',as_of:'',active:0,total:0,latest_updated_at:'',refreshed_at:'',tenure:[],positions:[],platforms:[],countries:[]})"
              ),
              (
                  "  const writeEmployee=async body=>{\n    const {data,error}=await supabase.functions.invoke('admin-employee-write',{body})\n    if(error||data?.error) throw new Error(data?.error||error?.message||'员工资料保存失败')\n    return data\n  }\n\n  const checkEmployeeIdentity=async body=>{",
                  "  const writeEmployee=async body=>{\n    const {data,error}=await supabase.functions.invoke('admin-employee-write',{body})\n    if(error||data?.error) throw new Error(data?.error||error?.message||'员工资料保存失败')\n    return data\n  }\n\n  const loadOperatorMap=async employeeIds=>{\n    const ids=(employeeIds||[]).map(text).filter(Boolean)\n    if(!ids.length) return new Map()\n    const {data,error}=await supabase.functions.invoke('admin-employee-operators',{body:{employee_ids:ids}})\n    if(error||data?.error) return new Map()\n    return new Map((data?.rows||[]).map(x=>[text(x.employee_id),text(x.operator_account)]))\n  }\n\n  const checkEmployeeIdentity=async body=>{"
              ),
              (
                  "      setArchiveStats({...data,loading:false,error:''})",
                  "      setArchiveStats({...data,loading:false,error:'',refreshed_at:new Date().toISOString()})"
              ),
              (
                  "      const visibleRows=(data.rows||[]).filter(r=>text(r.source_type)!=='google_deleted')\n      setRows(visibleRows)\n      setTotal(Math.max(0,(data.total||0)-((data.rows||[]).length-visibleRows.length)))",
                  "      const visibleRows=(data.rows||[]).filter(r=>text(r.source_type)!=='google_deleted')\n      const operatorMap=await loadOperatorMap(visibleRows.map(r=>r.id))\n      setRows(visibleRows.map(r=>({...r,operator_account:operatorMap.get(text(r.id))||text(r.operator_account)})))\n      setTotal(Math.max(0,(data.total||0)-((data.rows||[]).length-visibleRows.length)))"
              ),
              (
                  "<thead><tr><th>员工ID</th><th>姓名</th><th>员工国家</th><th>团队</th><th>组长</th><th>岗位</th><th>班次</th><th>员工类型</th><th>入职日期</th><th>入职时长</th><th>录入时间</th><th>资料</th><th>账号</th><th>操作</th></tr></thead>",
                  "<thead><tr><th>员工ID</th><th>姓名</th><th>员工国家</th><th>团队</th><th>组长</th><th>岗位</th><th>班次</th><th>员工类型</th><th>入职日期</th><th>入职时长</th><th>录入时间</th><th>操作人账号</th><th>资料</th><th>账号</th><th>操作</th></tr></thead>"
              ),
              (
                  "<td><strong>{r.employee_no}</strong></td><td>{r.full_name}</td><td>{r.country||r.nationality||'-'}</td><td>{r.teams?.name||'-'}</td><td>{r.leader_name||'-'}</td><td>{r.positions?.name||'-'}</td><td>{r.shift_name||'-'}</td><td>{typeName(r.employment_type)}</td><td className=\"employee-hire-date-cell\">{text(r.hire_date).slice(0,10)||'-'}</td><td><strong>{tenureCompactLabel(r.hire_date,r.resign_date,r.status)}</strong></td><td>{formatDateTime(r.created_at)}</td>\n              <td>{r.missing_count>0?",
                  "<td><strong>{r.employee_no}</strong></td><td>{r.full_name}</td><td>{r.country||r.nationality||'-'}</td><td>{r.teams?.name||'-'}</td><td>{r.leader_name||'-'}</td><td>{r.positions?.name||'-'}</td><td>{r.shift_name||'-'}</td><td>{typeName(r.employment_type)}</td><td className=\"employee-hire-date-cell\">{text(r.hire_date).slice(0,10)||'-'}</td><td><strong>{tenureCompactLabel(r.hire_date,r.resign_date,r.status)}</strong></td><td>{formatDateTime(r.created_at)}</td><td><span className=\"operator-chip\">{operatorDisplay(r.operator_account)}</span></td>\n              <td>{r.missing_count>0?"
              ),
              (
                  "{(detail.actions?.can_cancel_hire||isPendingHireForCancel(e.hire_date,e.status)||(detail.actions?.can_edit&&detail.actions?.can_resign&&detail.actions?.can_reactivate))&&<button className=\"cancel-hire-outline\" title=\"不符合撤销条件时系统会安全拒绝，不会删除员工资料\" onClick={onCancelHire}>撤销入职</button>}",
                  "{(detail.actions?.can_cancel_hire||isPendingHireForCancel(e.hire_date,e.status)||detail.actions?.can_edit)&&<button className=\"cancel-hire-outline\" title=\"不符合撤销条件时系统会安全拒绝，不会删除员工资料\" onClick={onCancelHire}>撤销入职</button>}"
              ),
              (
                  "function ArchiveStructureStats({data,onTenure,onPosition,onCountry}){\n  const tenureRows=data?.tenure||[]\n  const updated=data?.latest_updated_at?formatDateTime(data.latest_updated_at):'—'",
                  "function ArchiveStructureStats({data,onTenure,onPosition,onCountry}){\n  const tenureRows=data?.tenure||[]\n  const updated=data?.refreshed_at?formatDateTime(data.refreshed_at):'—'\n  const changed=data?.latest_updated_at?formatDateTime(data.latest_updated_at):'—'"
              ),
              (
                  "<div className={`archive-sync-badge ${data?.error?'has-error':''}`}><i/><span>{data?.error?'结构统计待部署':`Supabase 更新 ${updated}`}</span></div>",
                  "<div className={`archive-sync-badge ${data?.error?'has-error':''}`}><i/><span title={`最近数据变更 ${changed}`}>{data?.error?'结构统计待部署':`实时已连接 · ${updated}`}</span></div>"
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:120]}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Sanity check
        run: |
          npm install
          npm run build

      - name: Commit only employee frontend changes
        run: |
          git config user.name "WFH Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wfh-employee-operator-touch.yml
          git add src/pages/AdminEmployeesPage.jsx
          git diff --cached --check
          git commit -m "fix: show employee operators and live refresh status"
          git push origin HEAD:main
